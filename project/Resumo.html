<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&family=PT+Mono&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-primary:#111111; --color-accent:#8B5CF6; --color-success:#16A34A;
      --color-warning:#D97706; --color-danger:#DC2626; --color-surface:#FFFFFF;
      --color-text:#111827; --bg:#F4F3EF; --border:#E5E4DE; --border-strong:#C8C7BF;
      --text-2:#6B7280; --text-3:#9CA3AF; --accent-bg:#F5F3FF; --success-bg:#F0FDF4;
      --font-display:'Montserrat',sans-serif; --font-body:'Roboto',sans-serif; --font-mono:'PT Mono',monospace;
    }
    html, body, #root { height:100%; }
    body { font-family:var(--font-body); background:var(--bg); color:var(--color-text); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
    textarea, input, select, button { font-family:var(--font-body); font-size:14px; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:3px; }
    @keyframes spin    { to { transform:rotate(360deg); } }
    @keyframes modalIn { from { opacity:0; transform:translateY(8px) scale(0.98); } to { opacity:1; transform:none; } }
    .spin { animation:spin 0.7s linear infinite; }
    .fade { animation:modalIn 0.18s ease forwards; }
    @media (max-width:768px) {
      .sidebar { display:none !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── TOKENS ───────────────────────────────────────────────────────── */
const T = {
  bg:'#F4F3EF', surface:'#FFFFFF', border:'#E5E4DE', borderStrong:'#C8C7BF',
  text:'#111827', t2:'#6B7280', t3:'#9CA3AF', primary:'#111111',
  accent:'#8B5CF6', accentBg:'#F5F3FF', success:'#16A34A', successBg:'#F0FDF4',
  warning:'#D97706', danger:'#DC2626',
};

/* ── DATA ─────────────────────────────────────────────────────────── */
const RESUME_DATA = { name:'Kanishk_Singh_Resume.pdf', format:'PDF', chars:4200, modified:'Jun 10' };

const PROMPTS = [
  { id:1, name:'Default tailoring prompt', active:true  },
  { id:2, name:'Product Design roles',     active:false },
];

const COMPANIES = [
  { id:1, name:'Linear',  role:'Product Designer',        date:'Jun 8'  },
  { id:2, name:'Vercel',  role:'Senior Product Designer', date:'Jun 5'  },
  { id:3, name:'Stripe',  role:'Design Systems Lead',     date:'May 28' },
];

const INIT_TEMPLATES = [
  { id:1, name:"Jake's Resume",    type:'builtin', latex:'' },
  { id:2, name:'AltaCV',           type:'builtin', latex:'' },
  { id:3, name:'ModernCV Classic', type:'builtin', latex:'' },
];

const DEFAULT_PROMPT =
`You are a resume tailoring assistant. Output ONLY a valid JSON object.

Given a base resume and a job description, produce a tightly tailored ONE-PAGE resume.

CONTENT RULES:
- Do NOT invent roles, companies, or skills not in the base resume
- Pick the most JD-relevant experiences; max 3 bullets per role
- Each bullet: strong action verb + concrete metric or outcome
- Summary: 2–3 sentences tailored to the role`;

const RESULT = {
  name:'Kanishk Singh', subtitle:'Product Designer · Bengaluru, India',
  contact:'kanishk@example.com · linkedin.com/in/kanishk · kanishk.design',
  summary:'Product designer with 4 years building 0→1 and growth-stage products. Deep experience in design systems, component libraries, and cross-functional collaboration with engineering teams.',
  experience:[
    { company:'Acme Corp', role:'Senior Product Designer', dates:'Jan 2023 – Present',
      bullets:['Redesigned core dashboard — increased daily active usage by 34%','Built and shipped component library used by 8 engineers across 3 products','Led 0→1 design for mobile app, from discovery to App Store launch'] },
    { company:'Beta Studio', role:'Product Designer', dates:'Mar 2021 – Dec 2022',
      bullets:['Owned end-to-end design for B2B SaaS product (12k users)','Established design system reducing redundant component work by 60%'] },
  ],
  skills:[
    { category:'Design',   values:'Figma, Framer, Principle' },
    { category:'Research', values:'User interviews, usability testing, competitive analysis' },
    { category:'Systems',  values:'Design tokens, component libraries, documentation' },
    { category:'Handoff',  values:'Zeplin, Storybook, design specs' },
  ],
  company:'Linear',
  changes:[
    { section:'Summary',    action:'Reworded',      before:'Product designer focused on clean interfaces.', after:'Product designer with 4 years building 0→1 and growth-stage products. Deep experience in design systems…' },
    { section:'Experience', ctx:'Acme Corp',         action:'Rephrased',     before:'Improved core dashboard metrics significantly', after:'Redesigned core dashboard — increased daily active usage by 34%' },
    { section:'Experience', ctx:'Acme Corp',         action:'Promoted',      before:'Helped with component library development', after:'Built and shipped component library used by 8 engineers across 3 products' },
    { section:'Skills',     action:'Keyword added',  before:'Figma, Framer', after:'Figma, Framer, Principle' },
    { section:'Experience', ctx:'Beta Studio',       action:'Reordered',     before:'Worked on design system to improve efficiency', after:'Established design system reducing redundant work by 60%' },
  ],
};

/* ── ICONS ────────────────────────────────────────────────────────── */
const I = {
  Home:     ()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7L8 2l6 5v7a.5.5 0 01-.5.5H10V10H6v4.5H2.5A.5.5 0 012 14V7z"/></svg>,
  Template: ()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="12" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>,
  Settings: ()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.4 3.4l.7.7M11.9 11.9l.7.7M12.6 3.4l-.7.7M4.1 11.9l-.7.7"/></svg>,
  File:     ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 1.5H3.5a1 1 0 00-1 1v9a1 1 0 001 1h7a1 1 0 001-1V5.5L8 1.5z"/><path d="M8 1.5v4h4"/></svg>,
  Send:     ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 7L2 2l2.5 5L2 12l10-5z"/></svg>,
  Plus:     ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2"   strokeLinecap="round"><path d="M7 2v10M2 7h10"/></svg>,
  Chev:     ()=><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 4.5l3 3 3-3"/></svg>,
  Close:    ()=><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M3 3l8 8M11 3L3 11"/></svg>,
  Download: ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7 2v7M4.5 6.5L7 9l2.5-2.5"/><path d="M2 11.5h10"/></svg>,
  Upload:   ()=><svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M4.67 18.67v2.66A2.67 2.67 0 007.33 24h13.34a2.67 2.67 0 002.66-2.67v-2.66M18.67 9.33L14 4.67l-4.67 4.66M14 4.67v13.33"/></svg>,
  UploadSm: ()=><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 10v2a.5.5 0 00.5.5h9a.5.5 0 00.5-.5v-2M9.5 4.5L7 2l-2.5 2.5M7 2v7"/></svg>,
  External: ()=><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 2H2v8h8V7M7 2h3v3M5 7l5-5"/></svg>,
  Check:    ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 7l3.5 3.5 5.5-6"/></svg>,
  Back:     ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10 7H4M6.5 4.5L4 7l2.5 2.5"/></svg>,
  Prompts:  ()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"/></svg>,
  Companies:()=><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="12" height="7" rx="1"/><path d="M5 7V5a1 1 0 011-1h4a1 1 0 011 1v2M2 11h12"/></svg>,
  Search:   ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="6" r="3.5"/><path d="M9.5 9.5l2 2"/></svg>,
  Collapse: ()=><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 3L5 7l4 4"/></svg>,
  Expand:   ()=><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 3l4 4-4 4"/></svg>,
  Edit:     ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2.5l2 2-7 7H2.5v-2l7-7z"/><path d="M8 4l2 2"/></svg>,
  ZoomIn:   ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="5.5" cy="5.5" r="3.5"/><path d="M9 9l2.5 2.5M5.5 3.5v4M3.5 5.5h4"/></svg>,
  ZoomOut:  ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="5.5" cy="5.5" r="3.5"/><path d="M9 9l2.5 2.5M3.5 5.5h4"/></svg>,
  FitW:     ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M1 7h12M3.5 4.5L1 7l2.5 2.5M10.5 4.5L13 7l-2.5 2.5"/></svg>,
  Print:    ()=><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="8" width="8" height="4" rx="0.5"/><path d="M3 8V5h8v3M3 10H2a.5.5 0 01-.5-.5v-4A.5.5 0 012 5h10a.5.5 0 01.5.5v4a.5.5 0 01-.5.5h-1"/><path d="M5 3h4V5H5V3z"/><circle cx="10.5" cy="7" r="0.5" fill="currentColor" stroke="none"/></svg>,
};

/* ── ATOMS ────────────────────────────────────────────────────────── */
const PanelLabel = ({children,style={}}) => (
  <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase',color:T.t3,...style}}>
    {children}
  </span>
);
const Divider = ({style={}}) => <div style={{height:'1px',background:T.border,...style}} />;

/* ── RESIZE DIVIDER ───────────────────────────────────────────────── */
function ResizeDivider({ onMouseDown, active }) {
  const [hov, setHov] = useState(false);
  const on = hov || active;
  return (
    <div
      onMouseDown={onMouseDown}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        width:'5px', flexShrink:0, cursor:'col-resize', zIndex:10,
        background: on ? `${T.accent}22` : 'transparent',
        borderLeft: `1px solid ${on ? T.accent : T.border}`,
        transition:'background 0.12s, border-color 0.12s',
        userSelect:'none',
      }}
    />
  );
}

/* ── SIDEBAR ──────────────────────────────────────────────────────── */
function Sidebar({ nav, setNav, onSettings, collapsed, onToggle, width }) {
  const items = [
    { id:'home',      label:'Dashboard', Icon:I.Home      },
    { id:'prompts',   label:'Prompts',   Icon:I.Prompts   },
    { id:'companies', label:'Companies', Icon:I.Companies },
    { id:'templates', label:'Templates', Icon:I.Template  },
  ];
  return (
    <div className="sidebar" style={{width:collapsed?56:(width||220),minWidth:collapsed?56:(width||220),flexShrink:0,background:'#FDFCFB',borderRight:collapsed?`1px solid ${T.border}`:'none',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 12px',height:'52px',borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        {!collapsed && <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'15px',letterSpacing:'-0.02em',color:T.text}}>resumo</span>}
        <button onClick={onToggle} style={{background:'none',border:'none',cursor:'pointer',color:T.t3,display:'flex',padding:'4px',borderRadius:'3px',marginLeft:collapsed?'auto':0,marginRight:collapsed?'auto':0,lineHeight:0}}>
          {collapsed ? <I.Expand /> : <I.Collapse />}
        </button>
      </div>
      <nav style={{flex:1,padding:'8px',display:'flex',flexDirection:'column',gap:'1px'}}>
        {items.map(({id,label,Icon}) => {
          const active = nav===id;
          return (
            <div key={id} onClick={()=>setNav(id)} style={{display:'flex',alignItems:'center',gap:'9px',padding:collapsed?'9px 0':'8px 10px',justifyContent:collapsed?'center':'flex-start',borderRadius:'4px',cursor:'pointer',fontSize:'13px',fontWeight:active?500:400,color:active?T.text:T.t2,background:active?T.accentBg:'transparent',borderLeft:!collapsed?(active?`2px solid ${T.accent}`:'2px solid transparent'):'none',transition:'all 0.1s',userSelect:'none'}}>
              <span style={{color:active?T.accent:T.t3,flexShrink:0,lineHeight:0}}><Icon /></span>
              {!collapsed && label}
            </div>
          );
        })}
      </nav>
      <div style={{padding:'8px',borderTop:`1px solid ${T.border}`}}>
        <div onClick={onSettings} style={{display:'flex',alignItems:'center',gap:'9px',padding:collapsed?'9px 0':'8px 10px',justifyContent:collapsed?'center':'flex-start',borderRadius:'4px',cursor:'pointer',color:T.t3,fontSize:'13px',transition:'all 0.1s',userSelect:'none'}}>
          <span style={{lineHeight:0}}><I.Settings /></span>
          {!collapsed && 'Settings'}
        </div>
      </div>
    </div>
  );
}

/* ── PROMPTS VIEW ────────────────────────────────────────────────── */
function PromptsView() {
  const [sel, setSel] = useState(0);
  const [text, setText] = useState(DEFAULT_PROMPT);
  return (
    <div style={{flex:1,display:'grid',gridTemplateColumns:'200px 1fr',overflow:'hidden'}}>
      <div style={{borderRight:`1px solid ${T.border}`,display:'flex',flexDirection:'column'}}>
        <div style={{padding:'10px 12px',borderBottom:`1px solid ${T.border}`}}>
          <PanelLabel>Prompts</PanelLabel>
        </div>
        <div style={{flex:1,overflow:'auto',padding:'4px'}}>
          {PROMPTS.map((p,i)=>(
            <div key={p.id} onClick={()=>setSel(i)} style={{padding:'8px 10px',borderRadius:'3px',cursor:'pointer',display:'flex',alignItems:'center',gap:'7px',background:sel===i?T.accentBg:'transparent',borderLeft:sel===i?`2px solid ${T.accent}`:'2px solid transparent'}}>
              {p.active && <div style={{width:'6px',height:'6px',borderRadius:'50%',background:T.accent,flexShrink:0}} />}
              <span style={{fontSize:'13px',fontWeight:sel===i?500:400,color:sel===i?T.text:T.t2}}>{p.name}</span>
            </div>
          ))}
        </div>
        <div style={{padding:'8px',borderTop:`1px solid ${T.border}`}}>
          <button style={{display:'flex',alignItems:'center',gap:'5px',width:'100%',background:'none',border:`1px solid ${T.border}`,borderRadius:'3px',padding:'7px 10px',fontSize:'12px',cursor:'pointer',color:T.t2,fontFamily:'var(--font-body)'}}>
            <I.Plus /> New Prompt
          </button>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'13px 20px',borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
          <div style={{fontFamily:'var(--font-display)',fontSize:'14px',fontWeight:600}}>{PROMPTS[sel]?.name}</div>
        </div>
        <textarea value={text} onChange={e=>setText(e.target.value)}
          style={{flex:1,border:'none',outline:'none',padding:'16px 20px',fontSize:'12px',lineHeight:'1.8',fontFamily:'var(--font-mono)',resize:'none',color:T.text,background:'transparent'}} />
        <div style={{padding:'10px 20px',borderTop:`1px solid ${T.border}`,display:'flex',alignItems:'center',gap:'8px',background:'#F9F8F5',flexShrink:0}}>
          <button style={{padding:'6px 14px',background:T.primary,color:'#fff',border:'none',borderRadius:'3px',fontSize:'13px',cursor:'pointer',fontFamily:'var(--font-body)',fontWeight:500}}>Save</button>
          <button style={{display:'flex',alignItems:'center',gap:'5px',padding:'6px 12px',background:T.successBg,color:T.success,border:'1px solid #BBF7D0',borderRadius:'3px',fontSize:'12px',cursor:'pointer',fontFamily:'var(--font-body)',fontWeight:500}}>
            <div style={{width:'6px',height:'6px',borderRadius:'50%',background:T.success}} /> Active
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── COMPANIES VIEW ───────────────────────────────────────────────── */
function CompaniesView() {
  const [search, setSearch] = useState('');
  const filtered = COMPANIES.filter(c=>c.name.toLowerCase().includes(search.toLowerCase()));
  return (
    <div style={{flex:1,padding:'20px 24px',overflowY:'auto'}}>
      <div style={{display:'flex',gap:'8px',marginBottom:'16px'}}>
        <div style={{flex:1,position:'relative'}}>
          <span style={{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',color:T.t3,lineHeight:0}}><I.Search /></span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search companies…"
            style={{width:'100%',border:`1px solid ${T.border}`,borderRadius:'4px',padding:'8px 12px 8px 32px',fontSize:'13px',outline:'none',fontFamily:'var(--font-body)',color:T.text,background:T.surface}} />
        </div>
        <button style={{display:'flex',alignItems:'center',gap:'5px',padding:'8px 14px',background:T.primary,color:'#fff',border:'none',borderRadius:'4px',fontSize:'13px',cursor:'pointer',fontFamily:'var(--font-body)',fontWeight:500,whiteSpace:'nowrap'}}>
          <I.Plus /> Add Company
        </button>
      </div>
      {filtered.length===0 ? (
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:'4px',padding:'40px 24px',textAlign:'center',color:T.t3,fontSize:'13px'}}>
          {search?'No companies match your search.':'No companies yet. Add your first company above.'}
        </div>
      ) : (
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:'4px',overflow:'hidden'}}>
          {filtered.map((c,i)=>(
            <div key={c.id}
              style={{padding:'13px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:i<filtered.length-1?`1px solid ${T.border}`:'none',cursor:'pointer',transition:'background 0.1s'}}
              onMouseEnter={e=>e.currentTarget.style.background='#F9F8F5'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <div>
                <div style={{fontSize:'13px',fontWeight:500}}>{c.name}</div>
                <div style={{fontSize:'12px',color:T.t3,marginTop:'2px'}}>{c.role}</div>
              </div>
              <div style={{fontSize:'11px',color:T.t3,fontFamily:'var(--font-mono)'}}>{c.date}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── RESUME STATUS BAR ────────────────────────────────────────────── */
function ResumeBar({ onReplace }) {
  const r = RESUME_DATA;
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 14px',background:T.surface,border:`1px solid ${T.border}`,borderRadius:'4px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
        <span style={{color:T.t3,lineHeight:0}}><I.File /></span>
        <span style={{fontSize:'13px',fontWeight:500}}>{r.name}</span>
        <span style={{padding:'1px 5px',borderRadius:'2px',background:'#F3F4F6',color:T.t2,fontSize:'10px',fontWeight:700,letterSpacing:'0.04em'}}>{r.format}</span>
        <span style={{fontSize:'11px',color:T.t3,fontFamily:'var(--font-mono)'}}>{r.chars.toLocaleString()} chars</span>
        <span style={{fontSize:'11px',color:T.t3,fontFamily:'var(--font-mono)'}}>· {r.modified}</span>
      </div>

/* ── RESUME RIGHT PANEL ───────────────────────────────────────────── */
function ResumeRightPanel({ panelWidth }) {
  const A4_W = 794; // A4 @ 96 dpi
  const PAD  = 40;  // 20px each side
  const [zoom, setZoom]         = useState(() => +Math.max(0.4, Math.min(2.0, (panelWidth - 40) / 794)).toFixed(2));
  const [isFitW, setIsFitW]     = useState(true);
  const STEP = 0.1, MIN = 0.4, MAX = 2.0;

  const calcFitZoom = () => +Math.max(MIN, Math.min(MAX, (panelWidth - PAD) / A4_W)).toFixed(2);

  // Re-apply fit zoom when panel is resized while fit mode is active
  React.useEffect(() => { if (isFitW) setZoom(calcFitZoom()); }, [panelWidth]);

  const zoomIn   = () => { setZoom(z => +Math.min(MAX, z+STEP).toFixed(1)); setIsFitW(false); };
  const zoomOut  = () => { setZoom(z => +Math.max(MIN, z-STEP).toFixed(1)); setIsFitW(false); };
  const resetZoom = () => { setZoom(1); setIsFitW(false); };
  const fitWidth  = () => { setZoom(calcFitZoom()); setIsFitW(true); };

  const VDivider = () => <div style={{width:'1px',height:'16px',background:T.border,margin:'0 4px',flexShrink:0}} />;

  return (
    <div style={{display:'flex',flexDirection:'column',overflow:'hidden',background:T.bg,flex:'none',width:'100%',height:'100%'}}>

      {/* Toolbar */}
      <div style={{height:'34px',borderBottom:`1px solid ${T.border}`,background:'#FDFCFB',display:'flex',alignItems:'center',padding:'0 10px',gap:'1px',flexShrink:0}}>
        {/* Zoom controls */}
        <ToolBtn onClick={zoomOut} title="Zoom out (−)" disabled={zoom<=MIN}><I.ZoomOut /></ToolBtn>
        <button
          onClick={resetZoom}
          title="Reset to 100%"
          style={{padding:'2px 7px',background:'none',border:`1px solid ${T.border}`,borderRadius:'3px',fontSize:'11px',fontFamily:'var(--font-mono)',cursor:'pointer',color:T.t2,minWidth:'44px',lineHeight:'normal',transition:'border-color 0.1s'}}
          onMouseEnter={e=>e.currentTarget.style.borderColor=T.accent}
          onMouseLeave={e=>e.currentTarget.style.borderColor=T.border}
        >
          {Math.round(zoom*100)}%
        </button>
        <ToolBtn onClick={zoomIn} title="Zoom in (+)" disabled={zoom>=MAX}><I.ZoomIn /></ToolBtn>

        <VDivider />

        <ToolBtn onClick={fitWidth} title="Fit width" active={isFitW}><I.FitW /></ToolBtn>

        <div style={{flex:1}} />

        <ToolBtn title="Print"><I.Print /></ToolBtn>
        <VDivider />
        <ToolBtn title="Download PDF">
          <I.Download />
        </ToolBtn>
      </div>

      {/* Scrollable doc — always A4 width, zoom is purely visual */}
      <div style={{flex:1,overflowY:'auto',overflowX:'auto',padding:'20px'}}>
        <div style={{zoom:zoom,width:`${A4_W}px`,margin:'0 auto'}}>
          <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:'3px',boxShadow:'0 2px 14px rgba(0,0,0,0.07)',overflow:'hidden',width:`${A4_W}px`}}>
            <ResumeDoc />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── TEMPLATES VIEW ───────────────────────────────────────────────── */
function TemplatesView({ activeTemplate, setActiveTemplate }) {
  const [templates, setTemplates] = useState(INIT_TEMPLATES);
  const [showAddModal, setShowAddModal]   = useState(false);
  const [editTarget,   setEditTarget]     = useState(null); // template being edited

  const handleSetActive = (id) => {
    const tpl = templates.find(t=>t.id===id);
    if (tpl) setActiveTemplate(tpl.name);
  };
  const handleDelete = (id) => setTemplates(ts=>ts.filter(t=>t.id!==id));
  const handleAdd = ({name,latex}) => {
    setTemplates(ts=>[...ts,{id:Math.max(...ts.map(t=>t.id),0)+1,name,latex,type:'custom'}]);
    setShowAddModal(false);
  };
  const handleEditSave = (updated) => {
    setTemplates(ts=>ts.map(t=>t.id===updated.id ? updated : t));
    // If this was the active template and its name changed, update the active name
    if (activeTemplate === templates.find(t=>t.id===updated.id)?.name) {
      setActiveTemplate(updated.name);
    }
    setEditTarget(null);
  };

  return (
    <div style={{flex:1,padding:'20px 24px',overflowY:'auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'18px'}}>
        <div>
          <h2 style={{fontFamily:'var(--font-display)',fontSize:'15px',fontWeight:600,marginBottom:'3px'}}>Templates</h2>
          <p style={{fontSize:'12px',color:T.t2}}>Select a LaTeX template for your generated PDFs.</p>
        </div>
        <button onClick={()=>setShowAddModal(true)} style={{display:'flex',alignItems:'center',gap:'5px',padding:'8px 14px',background:T.primary,color:'#fff',border:'none',borderRadius:'4px',fontSize:'13px',fontWeight:500,cursor:'pointer',fontFamily:'var(--font-body)',flexShrink:0}}>
          <I.Plus /> Add Template
        </button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
        {templates.map(t=>(
          <TemplateCard
            key={t.id}
            template={t}
            active={t.name===activeTemplate}
            onSetActive={()=>handleSetActive(t.id)}
            onEdit={()=>setEditTarget(t)}
            onDelete={()=>handleDelete(t.id)}
          />
        ))}
      </div>
      {showAddModal && <AddTemplateModal onSave={handleAdd} onClose={()=>setShowAddModal(false)} />}
      {editTarget   && <EditTemplateModal template={editTarget} onSave={handleEditSave} onClose={()=>setEditTarget(null)} />}
    </div>
  );
}

/* ── APP ROOT ─────────────────────────────────────────────────────── */
function App() {
  const [nav, setNav]                   = useState('home');
  const [screen, setScreen]             = useState('dashboard');
  const [hasResume, setHasResume]       = useState(true);
  const [jdText, setJdText]             = useState('');
  const [showSettings, setShowSettings] = useState(false);
  const [collapsed, setCollapsed]       = useState(false);
  const [procMsg, setProcMsg]           = useState('Analysing job description…');
  const [activeTemplate, setActiveTemplate] = useState("Jake's Resume");
  const timers = useRef([]);
  const [sidebarW, setSidebarW]       = useState(220);
  const [rightPanelW, setRightPanelW] = useState(500);
  const [activeDrag, setActiveDrag]   = useState(null);
  const dragRef = useRef(null);

  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };

  const handleGenerate = () => {
    setScreen('processing'); setProcMsg('Analysing job description…');
    clearTimers();
    timers.current.push(setTimeout(()=>setProcMsg('Claude is tailoring your resume…'), 2500));
    timers.current.push(setTimeout(()=>setProcMsg('Compiling PDF…'), 5500));
    timers.current.push(setTimeout(()=>setScreen('result'), 8000));
  };

  const handleNewApp = () => { clearTimers(); setJdText(''); setScreen('dashboard'); setNav('home'); };
  const handleSkip   = () => { clearTimers(); setScreen('result'); };

  const startDrag = (type) => (e) => {
    e.preventDefault();
    dragRef.current = { type, startX: e.clientX, startW: type==='sidebar' ? sidebarW : rightPanelW };
    setActiveDrag(type);
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  };

  useEffect(()=>()=>clearTimers(), []);

  useEffect(()=>{
    const onMove = (e) => {
      if (!dragRef.current) return;
      const { type, startX, startW } = dragRef.current;
      const dx = e.clientX - startX;
      if (type==='sidebar') setSidebarW(Math.max(160, Math.min(400, startW + dx)));
      if (type==='right')   setRightPanelW(Math.max(220, Math.min(720, startW - dx)));
    };
    const onUp = () => {
      if (!dragRef.current) return;
      dragRef.current = null;
      setActiveDrag(null);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup',   onUp);
    };
  }, []);

  /* ── Full-screen states (no nav) */
  if (!hasResume)            return <SetupView onComplete={()=>setHasResume(true)} />;
  if (screen==='processing') return <ProcessingView message={procMsg} onSkip={handleSkip} />;

  /* ── Main content */
  const renderContent = () => {
    if (nav==='prompts')   return <PromptsView />;
    if (nav==='companies')  return <CompaniesView />;
    if (nav==='templates')  return <TemplatesView activeTemplate={activeTemplate} setActiveTemplate={setActiveTemplate} />;
    if (screen==='result')  return <ResultView onNewApplication={handleNewApp} />;
    return (
      <HomeView
        setHasResume={setHasResume}
        jdText={jdText} setJdText={setJdText}
        onGenerate={handleGenerate}
        activeTemplate={activeTemplate}
        onChangeTemplate={()=>setNav('templates')}
      />
    );
  };

  const headerLabel = () => {
    if (nav==='prompts')   return 'Prompts';
    if (nav==='companies') return 'Companies';
    if (nav==='templates') return 'Templates';
    if (screen==='result') return `Tailored for ${RESULT.company}`;
    return 'New Application';
  };

  const showRightPanel = nav === 'home';

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar nav={nav} setNav={id=>{setNav(id); if(id==='home')setScreen('dashboard');}} onSettings={()=>setShowSettings(true)} collapsed={collapsed} onToggle={()=>setCollapsed(v=>!v)} width={sidebarW} />
      {!collapsed && <ResizeDivider onMouseDown={startDrag('sidebar')} active={activeDrag==='sidebar'} />}

      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:450}}>
        <div style={{padding:'0 24px',height:'52px',borderBottom:`1px solid ${T.border}`,background:T.surface,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <PanelLabel>{headerLabel()}</PanelLabel>
          {screen==='result' && nav==='home' && (
            <button onClick={handleNewApp} style={{display:'flex',alignItems:'center',gap:'4px',background:'none',border:'none',fontSize:'12px',color:T.t3,cursor:'pointer',fontFamily:'var(--font-body)'}}>
              <I.Back /> New Application
            </button>
          )}
        </div>
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          {renderContent()}
        </div>
      </div>

      {showRightPanel && <>
        <ResizeDivider onMouseDown={startDrag('right')} active={activeDrag==='right'} />
        <div style={{width:rightPanelW,flexShrink:0,display:'flex',flexDirection:'column',overflow:'hidden',background:T.bg}}>
          <div style={{padding:'0 16px',height:'52px',borderBottom:`1px solid ${T.border}`,background:T.surface,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
            <PanelLabel>Resume Preview</PanelLabel>
            <span style={{fontSize:'11px',color:T.t3,fontFamily:'var(--font-mono)'}}>Uploaded · Jun 10</span>
          </div>
          <ResumeRightPanel panelWidth={rightPanelW} />
        </div>
      </>}

      {showSettings && (
        <SettingsModal
          onClose={()=>setShowSettings(false)}
          onGoTemplates={()=>setNav('templates')}
          activeTemplate={activeTemplate}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
